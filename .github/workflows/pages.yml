name: Deploy course sites to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      # Each edition directory is a self-contained Jekyll site, built under its
      # own baseurl. Add a build call here when creating a new edition.
      #
      # remote_theme downloads the theme zip from codeload.github.com with no
      # authentication (jekyll-remote-theme sends only a User-Agent), so it can
      # hit a transient 429 that no token can prevent -- hence the retry.
      # JEKYLL_GITHUB_TOKEN is unrelated to that: it is what jekyll-github-metadata
      # uses to avoid anonymous GitHub API limits.
      - name: Build sites
        run: |
          build() {
            for attempt in 1 2 3; do
              bundle exec jekyll build -s "$1" -d "_site/$1" -b "/smt-class/$1" && return 0
              echo "::warning::build of $1 failed (attempt $attempt of 3), retrying"
              sleep 30
            done
            echo "::error::build of $1 failed after 3 attempts"
            return 1
          }
          build 2024.2
          build 2026.2
        env:
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
          PAGES_REPO_NWO: ${{ github.repository }}
      - name: Add landing page
        run: cp index.html _site/
      # Guard against a silent regression to GitHub's default theme: if the
      # remote theme ever fails to apply, fail the build instead of deploying
      # an unstyled site.
      - name: Check theme was applied
        run: |
          for site in 2024.2 2026.2; do
            grep -q 'just-the-docs' "_site/$site/index.html" \
              || { echo "::error::$site built without the just-the-docs theme"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
